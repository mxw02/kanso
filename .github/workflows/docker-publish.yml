name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: 'Semver release tag (e.g. v0.2.0) triggered by release-please'
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
            image_name: kanso-api
          - service: mcp-server
            dockerfile: apps/mcp-server/Dockerfile
            image_name: kanso-mcp-server
          - service: web
            dockerfile: apps/web/Dockerfile
            image_name: kanso-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref }}

      - name: Normalize repository owner
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute release tags
        id: release_tags
        if: ${{ inputs.release_tag != '' }}
        run: |
          ver="${{ inputs.release_tag }}"
          ver="${ver#v}"
          minor="${ver%.*}"
          major="${ver%%.*}"
          {
            echo "tags<<EOF"
            echo "type=raw,value=${ver}"
            echo "type=raw,value=${minor}"
            echo "type=raw,value=${major}"
            echo "type=raw,value=latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ matrix.image_name }}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' && inputs.release_tag == '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            ${{ steps.release_tags.outputs.tags }}

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}
